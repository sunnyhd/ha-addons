# Watches the upstream local-audio-addon and opens a PR as soon as a new version
# is released. The PR raises two places TOGETHER: the `FROM` tag in the Dockerfile
# (the image sendspin-cli/pactl/s6 come from) and `version` in config.yaml -- the
# two must stay coherent, though they mean different things (see below).
#
# Self-contained: runs in this repo's own Actions, needs no external service (no
# Renovate/Dependabot app requirement). The version source is the latest GitHub
# release of music-assistant/local-audio-addon; its tag (`vX.Y.Z`) is also the
# image tag (`X.Y.Z`).
name: Check upstream version

on:
  schedule:
    - cron: "0 6 * * 1"   # every Monday 06:00 UTC
  workflow_dispatch: {}    # manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine versions
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest=$(gh api repos/music-assistant/local-audio-addon/releases/latest \
                     --jq .tag_name | sed 's/^v//')
          current=$(sed -n 's#^FROM ghcr.io/music-assistant/local-audio-addon:\(.*\)$#\1#p' \
                     zone_players/Dockerfile)
          echo "latest=$latest"   >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "Upstream: $latest   currently pinned: $current"

      - name: Raise files
        id: bump
        if: steps.v.outputs.latest != '' && steps.v.outputs.latest != steps.v.outputs.current
        run: |
          set -euo pipefail
          L="${{ steps.v.outputs.latest }}"        # new image tag (upstream)
          C="${{ steps.v.outputs.current }}"        # previous image tag
          # FROM follows the image tag.
          sed -i "s#^FROM ghcr.io/music-assistant/local-audio-addon:.*#FROM ghcr.io/music-assistant/local-audio-addon:${L}#" \
            zone_players/Dockerfile
          # config.yaml version is the add-on's OWN version, independent of the
          # image tag -- it gets a patch bump so the Supervisor shows
          # "update available".
          cur=$(sed -n 's/^version: "\(.*\)"/\1/p' zone_players/config.yaml)
          maj=${cur%%.*}; rest=${cur#*.}; min=${rest%%.*}; pat=${rest#*.}
          new="${maj}.${min}.$((pat + 1))"
          sed -i "s/^version: \".*\"/version: \"${new}\"/" zone_players/config.yaml
          echo "addon_new=$new" >> "$GITHUB_OUTPUT"
          # Prepend a CHANGELOG entry under the add-on's own version.
          tmp=$(mktemp)
          {
            head -n 1 zone_players/CHANGELOG.md
            printf '\n## %s\n\n- Base image raised to %s (was %s). Test before merging:\n  rebuild, then check the zone sinks and one handshake per zone.\n' "$new" "$L" "$C"
            tail -n +2 zone_players/CHANGELOG.md
          } > "$tmp"
          mv "$tmp" zone_players/CHANGELOG.md
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open PR
        if: steps.bump.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: "bump/local-audio-addon-${{ steps.v.outputs.latest }}"
          title: "Raise base image to ${{ steps.v.outputs.latest }} (add-on ${{ steps.bump.outputs.addon_new }})"
          commit-message: |
            Raise base image to ${{ steps.v.outputs.latest }}

            FROM tag and config.yaml version raised together (was
            ${{ steps.v.outputs.current }}). sendspin-cli and pactl come from
            this image; the zone logic is unchanged.
          body: |
            Automatic bump to the latest upstream release
            **${{ steps.v.outputs.latest }}** (was ${{ steps.v.outputs.current }}).

            Changed: `zone_players/Dockerfile` (FROM), `zone_players/config.yaml`
            (version), `zone_players/CHANGELOG.md`.

            **Test before merging:**
            - [ ] add-on rebuild completes (the Dockerfile assertion catches a
                  restructuring of the s6 services as a red build)
            - [ ] `pactl list sinks short` shows the zone sinks (`out_*`)
            - [ ] the add-on log shows one handshake per zone
            - [ ] a test tone per zone comes out of the expected output
