name: Local Audio – Büro
version: "0.1.13"
slug: local_audio_zone4
description: >-
  Sendspin player for Music Assistant, zone 4. Plays to one
  PulseAudio sink, so several of these split a multi-channel interface
  into independent stereo zones.
url: https://github.com/music-assistant/local-audio-addon
image: ghcr.io/music-assistant/local-audio-addon
arch:
  - amd64
  - aarch64
# Promotion to stable waits on validation against real Home Assistant OS
# hardware, which this release has not had.
stage: experimental
# Before Home Assistant, so a player that belongs to a group is already
# advertising by the time Music Assistant starts looking for it.
startup: services
# The image brings its own s6-overlay v3 init.
init: false
# Eigener Netzwerk-Namespace je Instanz: der Player lauscht auf dem festen
# Port 8928, den im Netz des Hosts nur eine Instanz bekommen koennte. Ohne
# Host-Netz gibt es kein mDNS, also muss `server` gesetzt sein -- der Player
# waehlt sich dort ein, statt gefunden zu werden.
host_network: false
# Maps Home Assistant's PulseAudio in: an /etc/asound.conf routing `default` to
# it, a client.conf naming the sink, and the socket under /run/audio. It also
# gives this app its own Audio selector, which is how a user points it at a USB
# DAC.
audio: true
options:
  # Empty rather than absent, so the configuration screen shows the field
  # instead of folding it away as unused. An empty name is the default,
  # "Local Audio".
  name: "Büro"
  output: pulse:out_7_8_side
  log_level: info
# `server`, `buffer_ms` and the two hooks are optional with no default on
# purpose, which is what keeps them out of `options:` above and so behind the
# fold a user has to open deliberately. Setting a `server` switches the player to
# dialling out, which suppresses its mDNS advertisement. An unset `buffer_ms` has
# to reach the player as no setting at all rather than as a number written here,
# so that the default stays upstream's to change; the range is upstream's own, so
# the configuration screen refuses what the player would refuse.
#
# `hook_start` and `hook_stop` are `str?` because a shell command is what they
# are: there is no narrower schema that would describe one, and no validation
# here that would make an arbitrary command safer than the person who typed it.
schema:
  name: str?
  output: list(default|pulse:out_1_2_front|pulse:out_3_4_rear|pulse:out_5_6_center_sub|pulse:out_7_8_side|pulse:out_all)?
  log_level: list(debug|info|warning|error)
  server: str?
  buffer_ms: int(10,2000)?
  hook_start: str?
  hook_stop: str?

# Ohne eigene Identitaet leiten alle Instanzen dieselbe aus der MAC der
# Netzwerkkarte ab, und ein Server legt Lautstaerke, Gruppenzugehoerigkeit und
# Pairing unter ihr ab -- die Einstellungen aller Zonen landen dann auf
# derjenigen, die sich zuletzt verbunden hat. Der Wert muss nur stabil und pro
# Instanz verschieden sein, und der Slug ist beides.
environment:
  SENDSPIN_ID: local_audio_zone4
