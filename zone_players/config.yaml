name: Local Audio Zones
version: "0.1.0"
slug: zone_players
description: >-
  Splits a multi-channel audio output into independent stereo zones and plays
  each as its own Sendspin player for Music Assistant.
url: https://github.com/sunnyhd/ha-addons
arch:
  - amd64
  - aarch64
stage: experimental
# Before Home Assistant, so the zones are already advertising when Music
# Assistant starts looking.
startup: services
# The image brings its own s6-overlay v3.
init: false
# Own network namespace. The players listen on 8928 upward, one per zone; on the
# host's network that would be as many bidders for the same port as there are
# zones. Without host networking there is no mDNS for it -- which is why `server`
# below is required and the player dials out instead of being discovered.
host_network: false
# Maps Home Assistant's PulseAudio in: the socket under /run/audio, through
# which this add-on creates and plays the zones.
audio: true
options:
  server: ""
  log_level: info
  zones:
    - name: Living Room
      output: out_1_2_front
# `master_sink` and `buffer_ms` have no default and therefore sit behind the fold
# a user opens deliberately: the output is detected, and the buffer size is
# upstream's to own.
schema:
  server: str
  master_sink: str?
  log_level: list(debug|info|warning|error)
  buffer_ms: int(10,2000)?
  zones:
    - name: str
      output: list(out_1_2_front|out_3_4_rear|out_5_6_center_sub|out_7_8_side|out_all)
